name: Daily CISA KEV ingestion

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check httpx

      - name: Ingest latest CISA KEV records
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          test -n "$BACKEND_API_URL"
          python scripts/ingest_cisa_kev.py --base-url "$BACKEND_API_URL" --limit 50
